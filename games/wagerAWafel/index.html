<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>het wafel spel</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="body">
    <h1>Wager a wafel</h1>
    <main class="game-area">
        <div class="wafel-score">
            <img class="wafel" onclick="addScore(event)" src="img/wafel.webp" alt="Wafel" draggable="false">

            <div class="counter" id="counter">
                <p>Score: <span id="score">0</span></p>
            </div>
            <p id="antiCheatStatus" class="anti-cheat-status" aria-live="polite"></p>
        </div>

        <div class="game-panel">
            <div class="reward-roll" id="rewardRoll" aria-live="polite">
                <div class="reward-roll-box">
                    <div class="roll-pointer"></div>
                    <div class="roll-wheel" id="rollWheel">
                        <span class="roll-label roll-label-green"></span>
                        <span class="roll-label roll-label-red"></span>
                    </div>
                    <p id="rollStatus"></p>
                </div>
            </div>

            <div class="buttons">

                <input type="number" id="gambleAmount" placeholder="Enter gamble amount" min="1">
                <button id="confirm" onclick="gamble()">Gamble</button>

                <button id="allIn" class="RGBbutton" onclick="allIn()">All in</button>
            </div>
        </div>
    </main>
    <p style="margin-top: 100px;">Credits: Jan-Diederick</p>

    <script src="app.js"></script>
</body>

</html>
